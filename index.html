<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Padhlo Bachho — Class 10 & 12 Notes, PYQs & Books</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent-bg: #eff6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1050px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .navbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .logo-badge {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      padding: 8px 11px;
      border-radius: 8px;
      font-size: 1.1rem;
    }

    .brand h1 {
      font-size: 1.3rem;
      color: var(--text);
    }

    .tagline {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .search-box, .search-box input {
      width: 280px;
      max-width: 100%;
    }

    .search-box input {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .breadcrumb-bar {
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .breadcrumb-bar span {
      cursor: pointer;
      color: var(--primary);
      font-weight: 500;
    }

    .breadcrumb-bar span:hover {
      text-decoration: underline;
    }

    .main-content {
      flex: 1;
      padding: 26px 16px;
    }

    .section-title {
      font-size: 1.45rem;
      margin-bottom: 6px;
    }

    .section-subtitle {
      color: var(--muted);
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.08);
    }

    .card-badge {
      display: inline-block;
      background: var(--accent-bg);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .card p {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .study-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 16px;
    }

    .study-box h3 {
      margin-bottom: 12px;
      color: var(--primary-dark);
    }

    .study-box ul {
      padding-left: 20px;
    }

    .study-box li {
      margin-bottom: 8px;
    }

    .qa-item {
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }

    .qa-item:last-child {
      border-bottom: none;
    }

    .qa-q {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .qa-a {
      color: #334155;
      font-size: 0.95rem;
    }

    .btn-link {
      display: inline-block;
      margin-top: 10px;
      background: var(--primary);
      color: #fff;
      padding: 8px 14px;
      border-radius: 7px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .btn-link:hover {
      background: var(--primary-dark);
    }

    .footer {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 16px 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <div class="brand" onclick="goHome()">
        <span class="logo-badge">PB</span>
        <div>
          <h1>Padhlo Bachho</h1>
          <p class="tagline">Class 10 & 12 Notes, PYQs & Study Hub</p>
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search chapter, subject, ya PYQ..." oninput="handleSearch(this.value)" />
      </div>
    </div>
  </header>

  <div class="breadcrumb-bar">
    <div class="container" id="breadcrumbs"></div>
  </div>

  <main class="container main-content" id="app"></main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 <strong>Padhlo Bachho</strong> — Free Notes, Question-Answers, PYQs & Study Material for Class 10 & 12.</p>
    </div>
  </footer>

  <script>
    const STUDY_DATA = {

                title: "Real Numbers",
                notes: [
                  "Fundamental Theorem of Arithmetic: Har composite number ko prime numbers ke product ke roop mein uniquely express kiya ja sakta hai.",

                ]

            ],
            pyqs: [
              {
                year: "2025 Board Paper",
                title: "Class 10 Maths Standard PYQ 2025",

      },
      "12": {
        title: "Class 12th",
        subtitle: "Apni Stream chunein — Science, Commerce ya Arts",
        hasStreams: true,
        streams: {
          science: {
            name: "Science Stream",
            desc: "Physics, Chemistry, Mathematics & Biology",
            subjects: {

          },
          commerce: {
            name: "Commerce Stream",
            desc: "Accountancy, Business Studies & Economics",
            subjects: {
              accountancy: {

                desc: "Partnership, Company Accounts, Financial Analysis & PYQs",
                chapters: [
                  {
                    id: "ch1",
                    number: "Chapter 1",

                    notes: [

                pyqs: [
                  {
                    year: "2025 Board Paper",

                ],
                books: [
                  {
                    title: "Class 12 Accountancy Ratios & Formats Sheet",
                    type: "Revision PDF",
                    pdfUrl: "pdfs/class12-accounts-ratios.pdf"
                  }
                ]
              }
            }
          },
          arts: {
            name: "Arts / Humanities Stream",
            desc: "History, Political Science, Geography & Sociology",
            subjects: {
              history: {
                name: "History",
                desc: "Themes in Indian History, Important Dates, PYQs & Notes",
                chapters: [
                  {
                    id: "ch1",
                    number: "Chapter 1",
                    title: "Bricks, Beads and Bones (The Harappan Civilisation)",
                    notes: [
                      "Mature Harappan period lagbhag 2600 BCE se 1900 BCE tak maana jaata hai.",
                      "Mohenjodaro apne planned drainage system ke liye jaana jaata hai."
                    ],
                    qna: [
                      {
                        q: "Q1. Harappan drainage system ki ek khaasiyat likhein.",
                        a: "Naaliyan grid pattern mein bani thi aur bricks se dhaki hoti thi."
                      }
                    ],
                    chapterPyqs: [
                      {
                        year: "2024",
                        q: "Mention a major craft production center of Harappan Civilisation.",
                        a: "Chanhudaro bead-making aur shell-cutting ke liye prasiddh tha."
                      }
                    ]
                  }
                ],
                pyqs: [
                  {
                    year: "2025 Board Paper",
                    title: "Class 12 History PYQ 2025",
                    pdfUrl: "pdfs/class12-history-2025.pdf"
                  }
                ],
                books: [
                  {
                    title: "Class 12 History Timeline & Map Work PDF",

              }
            }
          }
        }
      }
    };

    let state = {
      classId: null,
      streamId: null,
      subjectId: null,
      subjectTab: "chapters",
      chapterId: null,
      chapterTab: "notes"
    };

    const appEl = document.getElementById("app");
    const breadcrumbsEl = document.getElementById("breadcrumbs");

    function goHome() {
      state = {
        classId: null,
        streamId: null,
        subjectId: null,
        subjectTab: "chapters",
        chapterId: null,
        chapterTab: "notes"
      };
      document.getElementById("searchInput").value = "";
      render();
    }

    function selectClass(classId) {
      state.classId = classId;
      state.streamId = null;
      state.subjectId = null;
      state.chapterId = null;
      render();
    }

    function selectStream(streamId) {
      state.streamId = streamId;
      state.subjectId = null;
      state.chapterId = null;
      render();
    }

    function selectSubject(subjectId) {
      state.subjectId = subjectId;
      state.subjectTab = "chapters";
      state.chapterId = null;
      render();
    }

    function switchSubjectTab(tab) {
      state.subjectTab = tab;
      state.chapterId = null;
      render();
    }

    function selectChapter(chapterId) {
      state.chapterId = chapterId;
      state.chapterTab = "notes";
      render();
    }

    function switchChapterTab(tab) {
      state.chapterTab = tab;
      render();
    }

    function getCurrentSubject() {
      if (!state.classId || !state.subjectId) return null;
      const cls = STUDY_DATA[state.classId];
      if (cls.hasStreams) {
        return cls.streams[state.streamId]?.subjects[state.subjectId] || null;
      }
      return cls.subjects[state.subjectId] || null;
    }

    function renderBreadcrumbs() {
      let crumbs = [`<span onclick="goHome()">Home</span>`];
      if (state.classId) {
        const cls = STUDY_DATA[state.classId];
        crumbs.push(`<span onclick="selectClass('${state.classId}')">${cls.title}</span>`);
        if (cls.hasStreams && state.streamId) {
          const strm = cls.streams[state.streamId];
          crumbs.push(`<span onclick="selectStream('${state.streamId}')">${strm.name}</span>`);
        }
        const subj = getCurrentSubject();
        if (subj) {
          crumbs.push(`<span onclick="selectSubject('${state.subjectId}')">${subj.name}</span>`);
          if (state.chapterId) {
            const ch = subj.chapters.find(c => c.id === state.chapterId);
            if (ch) crumbs.push(`<strong>${ch.number}: ${ch.title}</strong>`);
          }
        }
      }
      breadcrumbsEl.innerHTML = crumbs.join(" &rsaquo; ");
    }

    function render() {
      renderBreadcrumbs();

      if (!state.classId) {
        appEl.innerHTML = `
          <h2 class="section-title">Apni Class Chunein</h2>
          <p class="section-subtitle">Class 10 ya Class 12 select karke Notes, Question-Answers, PYQs aur Books access karein.</p>
          <div class="grid">
            <div class="card" onclick="selectClass('10')">
              <span class="card-badge">Secondary</span>
              <h3>Class 10th</h3>
              <p>Sabhi subjects ke Chapter Notes, Important Q&A, PYQs aur Books.</p>
            </div>
            <div class="card" onclick="selectClass('12')">
              <span class="card-badge">Senior Secondary</span>
              <h3>Class 12th</h3>
              <p>Science, Commerce aur Arts streams ke full notes, PYQs aur Books.</p>
            </div>
          </div>
        `;
        return;
      }

      const cls = STUDY_DATA[state.classId];

      if (cls.hasStreams && !state.streamId) {
        const streamCards = Object.entries(cls.streams).map(([key, strm]) => `
          <div class="card" onclick="selectStream('${key}')">
            <span class="card-badge">Class 12 Stream</span>
            <h3>${strm.name}</h3>
            <p>${strm.desc}</p>
          </div>
        `).join("");

        appEl.innerHTML = `
          <h2 class="section-title">Class 12th — Apni Stream Chunein</h2>
          <p class="section-subtitle">Stream select karne ke baad aapko usse jude subjects milenge.</p>
          <div class="grid">${streamCards}</div>
        `;
        return;
      }

      if (!state.subjectId) {
        const subjectsObj = cls.hasStreams ? cls.streams[state.streamId].subjects : cls.subjects;
        const subjectCards = Object.entries(subjectsObj).map(([key, subj]) => `
          <div class="card" onclick="selectSubject('${key}')">
            <span class="card-badge">${cls.title}</span>
            <h3>${subj.name}</h3>
            <p>${subj.desc}</p>
          </div>
        `).join("");

        appEl.innerHTML = `
          <h2 class="section-title">Subject Chunein</h2>
          <p class="section-subtitle">Kisi bhi subject par click karke Chapters, PYQs aur Books dekhein.</p>
          <div class="grid">${subjectCards}</div>
        `;
        return;
      }

      const subj = getCurrentSubject();

      if (!state.chapterId) {
        let tabContent = "";
        if (state.subjectTab === "chapters") {
          tabContent = `
            <div class="grid">
              ${subj.chapters.map(ch => `
                <div class="card" onclick="selectChapter('${ch.id}')">
                  <span class="card-badge">${ch.number}</span>
                  <h3>${ch.title}</h3>
                  <p>Notes • Question-Answers • Chapter PYQs</p>
                </div>
              `).join("")}
            </div>
          `;
        } else if (state.subjectTab === "pyqs") {
          tabContent = subj.pyqs.map(p => `
            <div class="study-box">
              <span class="card-badge">${p.year}</span>
              <h3>${p.title}</h3>
              <a class="btn-link" href="${p.pdfUrl}" target="_blank">Download / View PYQ PDF</a>
            </div>
          `).join("");
        } else if (state.subjectTab === "books") {
          tabContent = subj.books.map(b => `
            <div class="study-box">
              <span class="card-badge">${b.type}</span>
              <h3>${b.title}</h3>
              <a class="btn-link" href="${b.pdfUrl}" target="_blank">Open / Download PDF</a>
            </div>
          `).join("");
        }

        appEl.innerHTML = `
          <h2 class="section-title">${subj.name} (${cls.title})</h2>
          <p class="section-subtitle">${subj.desc}</p>
          <div class="tabs">
            <button class="tab-btn ${state.subjectTab === 'chapters' ? 'active' : ''}" onclick="switchSubjectTab('chapters')">Chapters (${subj.chapters.length})</button>
            <button class="tab-btn ${state.subjectTab === 'pyqs' ? 'active' : ''}" onclick="switchSubjectTab('pyqs')">PYQs (Alag Section)</button>
            <button class="tab-btn ${state.subjectTab === 'books' ? 'active' : ''}" onclick="switchSubjectTab('books')">Books & PDFs</button>
          </div>
          ${tabContent}
        `;
        return;
      }

      const ch = subj.chapters.find(c => c.id === state.chapterId);
      let chapterBody = "";

      if (state.chapterTab === "notes") {
        chapterBody = `
          <div class="study-box">
            <h3>Quick Revision Notes</h3>
            <ul>${ch.notes.map(n => `<li>${n}</li>`).join("")}</ul>
          </div>
        `;
      } else if (state.chapterTab === "qna") {
        chapterBody = `
          <div class="study-box">
            <h3>Important Question-Answers</h3>
            ${ch.qna.map(item => `
              <div class="qa-item">
                <div class="qa-q">${item.q}</div>
                <div class="qa-a">${item.a}</div>
              </div>
            `).join("")}
          </div>
        `;
      } else if (state.chapterTab === "pyqs") {
        chapterBody = `
          <div class="study-box">
            <h3>Is Chapter Ke Previous Year Questions (PYQs)</h3>
            ${ch.chapterPyqs.map(item => `
              <div class="qa-item">
                <span class="card-badge">Year: ${item.year}</span>
                <div class="qa-q">${item.q}</div>
                <div class="qa-a"><strong>Answer:</strong> ${item.a}</div>
              </div>
            `).join("")}
          </div>
        `;
      }

      appEl.innerHTML = `
        <h2 class="section-title">${ch.number}: ${ch.title}</h2>
        <p class="section-subtitle">${subj.name} — ${cls.title}</p>
        <div class="tabs">
          <button class="tab-btn ${state.chapterTab === 'notes' ? 'active' : ''}" onclick="switchChapterTab('notes')">Chapter Notes</button>
          <button class="tab-btn ${state.chapterTab === 'qna' ? 'active' : ''}" onclick="switchChapterTab('qna')">Question-Answers</button>
          <button class="tab-btn ${state.chapterTab === 'pyqs' ? 'active' : ''}" onclick="switchChapterTab('pyqs')">Chapter PYQs</button>
        </div>
        ${chapterBody}
      `;
    }

    function handleSearch(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        render();
        return;
      }

      let results = [];
      Object.entries(STUDY_DATA).forEach(([classId, cls]) => {
        const processSubjects = (subjects, streamId = null) => {
          Object.entries(subjects).forEach(([subjId, subj]) => {
            subj.chapters.forEach(ch => {
              const matchText = `${ch.title} ${ch.notes.join(" ")} ${ch.qna.map(x => x.q).join(" ")}`.toLowerCase();
              if (matchText.includes(q) || subj.name.toLowerCase().includes(q)) {
                results.push({
                  classId,
                  streamId,
                  subjId,
                  chapterId: ch.id,
                  label: `${cls.title} • ${subj.name}`,
                  title: `${ch.number}: ${ch.title}`
                });
              }
            });
          });
        };

        if (cls.hasStreams) {
          Object.entries(cls.streams).forEach(([streamId, strm]) => {
            processSubjects(strm.subjects, streamId);
          });
        } else {
          processSubjects(cls.subjects);
        }
      });

      breadcrumbsEl.innerHTML = `<span onclick="goHome()">Home</span> &rsaquo; Search Results for "${query}"`;

      if (results.length === 0) {
        appEl.innerHTML = `<p class="section-subtitle">Koi result nahi mila. Koi doosra chapter ya subject search karein.</p>`;
        return;
      }

      appEl.innerHTML = `
        <h2 class="section-title">Search Results (${results.length})</h2>
        <div class="grid">
          ${results.map(r => `
            <div class="card" onclick="openSearchResult('${r.classId}', ${r.streamId ? `'${r.streamId}'` : 'null'}, '${r.subjId}', '${r.chapterId}')">
              <span class="card-badge">${r.label}</span>
              <h3>${r.title}</h3>
              <p>Click karke Notes, Q&A aur PYQs kholein</p>
            </div>
          `).join("")}
        </div>
      `;
    }

    function openSearchResult(classId, streamId, subjId, chapterId) {
      state.classId = classId;
      state.streamId = streamId;
      state.subjectId = subjId;
      state.chapterId = chapterId;
      state.chapterTab = "notes";
      document.getElementById("searchInput").value = "";
      render();
    }

    render();
  </script>
</body>
</html>
