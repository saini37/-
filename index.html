<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Padhlo Bachho — Premium Class 10 & 12 Study Hub</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --accent: #0ea5e9;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --soft: #eef2ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-weight: 800;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
    }

    .brand h1 {
      font-size: 1.28rem;
      font-weight: 800;
    }

    .tagline {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .search-box, .search-box input {
      width: 290px;
      max-width: 100%;
    }

    .search-box input {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.92rem;
      background: #fff;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .breadcrumb-bar {
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .breadcrumb-bar span {
      cursor: pointer;
      color: var(--primary);
      font-weight: 600;
    }

    .breadcrumb-bar span:hover {
      text-decoration: underline;
    }

    .hero {
      background: linear-gradient(135deg, #312e81 0%, #4f46e5 55%, #0284c7 100%);
      color: #fff;
      border-radius: 18px;
      padding: 26px 22px;
      margin-bottom: 24px;
      box-shadow: 0 12px 28px rgba(79, 70, 229, 0.18);
    }

    .hero h2 {
      font-size: 1.55rem;
      margin-bottom: 6px;
    }

    .hero p {
      color: #e0e7ff;
      font-size: 0.95rem;
      max-width: 680px;
    }

    .main-content {
      flex: 1;
      padding: 24px 16px 36px;
    }

    .section-title {
      font-size: 1.38rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .section-subtitle {
      color: var(--muted);
      margin-bottom: 18px;
      font-size: 0.94rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.07);
    }

    .card-badge {
      display: inline-block;
      background: var(--soft);
      color: var(--primary-dark);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .card p {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chapter-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .chapter-row:hover {
      border-color: var(--primary);
      transform: translateX(3px);
    }

    .chapter-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ch-num {
      background: var(--soft);
      color: var(--primary);
      font-weight: 800;
      min-width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.92rem;
    }

    .chapter-row h3 {
      font-size: 1.02rem;
      margin-bottom: 2px;
    }

    .chapter-row p {
      font-size: 0.84rem;
      color: var(--muted);
    }

    .arrow-pill {
      color: var(--primary);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 10px 16px;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .study-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .study-box h3 {
      margin-bottom: 12px;
      color: var(--primary-dark);
      font-size: 1.12rem;
    }

    .diagram-card {
      margin-bottom: 18px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .diagram-card img {
      max-width: 100%;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
    }

    .diagram-caption {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
    }

    .numbered-list {
      padding-left: 20px;
    }

    .numbered-list li {
      margin-bottom: 10px;
    }

    .qa-item {
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }

    .qa-item:last-child {
      border-bottom: none;
    }

    .qa-q {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .qa-a {
      color: #334155;
      font-size: 0.94rem;
    }

    .btn-link {
      display: inline-block;
      margin-top: 10px;
      background: var(--primary);
      color: #fff;
      padding: 9px 15px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .btn-link:hover {
      background: var(--primary-dark);
    }

    .footer {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 16px 0;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <div class="brand" onclick="goHome()">
        <span class="logo-badge">PB</span>
        <div>
          <h1>Padhlo Bachho</h1>
          <p class="tagline">Class 10 &amp; 12 Notes, Diagrams, PYQs &amp; Books</p>
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search chapter, subject, ya PYQ..." oninput="handleSearch(this.value)" />
      </div>
    </div>
  </header>

  <div class="breadcrumb-bar">
    <div class="container" id="breadcrumbs"></div>
  </div>

  <main class="container main-content" id="app"></main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 <strong>Padhlo Bachho</strong> — Smart Notes, Visual Diagrams, Question-Answers &amp; PYQs.</p>
    </div>
  </footer>

  <script>

          maths: {
            name: "Mathematics (Basic & Standard)",
            desc: "2026 Syllabus: Chapters, Formulas, Basic & Standard Q&A, aur PYQs",
            chapters: [
              {
                id: "ch1",
                number: "Chapter 1",
                title: "Real Numbers",
                diagram: "images/maths-ch1.jpg",
                diagramCaption: "Diagram: Prime Factorization Tree aur Real Number Line",
                notes: [
                  "Fundamental Theorem of Arithmetic: Har composite number ko prime numbers ke product ke roop mein uniquely likha ja sakta hai.",
                  "Relation: HCF(a, b) x LCM(a, b) = a x b."
                ],
                qna: [

                    q: "[Basic] 1. Agar HCF(306, 657) = 9 hai, toh LCM(306, 657) nikaliye.",

                ],

                  }
                ]
              }
              // <-- YAHAN MATHS KE BAQI CHAPTERS ADD KAREIN (comma lagakar) -->
            ],
            pyqs: [
              {
                year: "2026 Sample / 2025",
                title: "Class 10 Maths Standard & Basic PYQs",
                pdfUrl: "pdfs/class10-maths-2025.pdf"
              }
            ],
            books: [
              {
                title: "Class 10 All Chapters Maths Formula Book",
                type: "Formula PDF",
                pdfUrl: "pdfs/class10-maths-formulas.pdf"
              }
            ]
          }
          // <-- YAHAN CLASS 10 KE AUR SUBJECTS (English, Hindi, Punjabi, Social Science) ADD KAREIN -->
        }
      },
      "12": {
        title: "Class 12th",
        subtitle: "Apni Stream chunein — Science, Commerce ya Arts",
        hasStreams: true,
        streams: {
          science: {
            name: "Science Stream",
            desc: "Physics, Chemistry, Mathematics & Biology",
            subjects: {

                ],

          },
          commerce: {

            desc: "Accountancy, Business Studies & Economics",
            subjects: {
              accountancy: {

                        a: "Equal profit sharing aur koi interest on capital nahi."
                      }

                  }
                  // <-- YAHAN ACCOUNTANCY KE BAQI CHAPTERS ADD KAREIN -->
                ],
                pyqs: [
                  {
                    year: "2025 Board Paper",
                    title: "Class 12 Accountancy PYQ 2025",
                    pdfUrl: "pdfs/class12-accounts-2025.pdf"
                  }
                ],
                books: [
                  {
                    title: "Class 12 Accountancy Ratios & Formats Sheet",
                    type: "Revision PDF",
                    pdfUrl: "pdfs/class12-accounts-ratios.pdf"
                  }
                ]
              }
            }
          },
          arts: {
            name: "Arts / Humanities Stream",
            desc: "History, Political Science, Geography & Sociology",
            subjects: {
              history: {
                name: "History",
                desc: "Themes in Indian History, Visuals, PYQs & Notes",
                chapters: [
                  {
                    id: "ch1",
                    number: "Chapter 1",
                    title: "Bricks, Beads and Bones (The Harappan Civilisation)",
                    diagram: "images/history-ch1.jpg",
                    diagramCaption: "Illustration: Harappan city planning, drainage system aur seals",
                    notes: [
                      "Mature Harappan period lagbhag 2600 BCE se 1900 BCE tak maana jaata hai.",
                      "Mohenjodaro apne planned drainage system ke liye jaana jaata hai."
                    ],
                    qna: [
                      {
                        q: "1. Harappan drainage system ki ek khaasiyat likhein.",
                        a: "Naaliyan grid pattern mein bani thi aur bricks se dhaki hoti thi."
                      }
                    ],
                    chapterPyqs: [
                      {
                        year: "2024",
                        q: "Mention a major craft production center of Harappan Civilisation.",
                        a: "Chanhudaro bead-making aur shell-cutting ke liye prasiddh tha."
                      }
                    ]
                  }
                  // <-- YAHAN HISTORY KE BAQI CHAPTERS ADD KAREIN -->
                ],
                pyqs: [
                  {
                    year: "2025 Board Paper",
                    title: "Class 12 History PYQ 2025",
                    pdfUrl: "pdfs/class12-history-2025.pdf"
                  }
                ],
                books: [
                  {
                    title: "Class 12 History Timeline & Map Work PDF",
                    type: "Map & Timeline PDF",
                    pdfUrl: "pdfs/class12-history-maps.pdf"
                  }
                ]
              }
            }
          }
        }
      }
    };

    let state = {
      classId: null,
      streamId: null,
      subjectId: null,
      subjectTab: "chapters",
      chapterId: null,
      chapterTab: "notes"
    };

    const appEl = document.getElementById("app");
    const breadcrumbsEl = document.getElementById("breadcrumbs");

    function goHome() {
      state = {
        classId: null,
        streamId: null,
        subjectId: null,
        subjectTab: "chapters",
        chapterId: null,
        chapterTab: "notes"
      };
      document.getElementById("searchInput").value = "";
      render();
    }

    function selectClass(classId) {
      state.classId = classId;
      state.streamId = null;
      state.subjectId = null;
      state.chapterId = null;
      render();
    }

    function selectStream(streamId) {
      state.streamId = streamId;
      state.subjectId = null;
      state.chapterId = null;
      render();
    }

    function selectSubject(subjectId) {
      state.subjectId = subjectId;
      state.subjectTab = "chapters";
      state.chapterId = null;
      render();
    }

    function switchSubjectTab(tab) {
      state.subjectTab = tab;
      state.chapterId = null;
      render();
    }

    function selectChapter(chapterId) {
      state.chapterId = chapterId;
      state.chapterTab = "notes";
      render();
    }

    function switchChapterTab(tab) {
      state.chapterTab = tab;
      render();
    }

    function getCurrentSubject() {
      if (!state.classId || !state.subjectId) return null;
      const cls = STUDY_DATA[state.classId];
      if (cls.hasStreams) {
        return cls.streams[state.streamId]?.subjects[state.subjectId] || null;
      }
      return cls.subjects[state.subjectId] || null;
    }

    function renderBreadcrumbs() {
      let crumbs = [`<span onclick="goHome()">Home</span>`];
      if (state.classId) {
        const cls = STUDY_DATA[state.classId];
        crumbs.push(`<span onclick="selectClass('${state.classId}')">${cls.title}</span>`);
        if (cls.hasStreams && state.streamId) {
          const strm = cls.streams[state.streamId];
          crumbs.push(`<span onclick="selectStream('${state.streamId}')">${strm.name}</span>`);
        }
        const subj = getCurrentSubject();
        if (subj) {
          crumbs.push(`<span onclick="selectSubject('${state.subjectId}')">${subj.name}</span>`);
          if (state.chapterId) {
            const ch = subj.chapters.find(c => c.id === state.chapterId);
            if (ch) crumbs.push(`<strong>${ch.number}: ${ch.title}</strong>`);
          }
        }
      }
      breadcrumbsEl.innerHTML = crumbs.join(" &rsaquo; ");
    }

    function render() {
      renderBreadcrumbs();

      if (!state.classId) {
        appEl.innerHTML = `
          <div class="hero">
            <h2>Padhlo Bachho — Smart Study Hub</h2>
            <p>Class 10th aur 12th ke students ke liye clean chapter listings, visual diagrams, important Q&amp;A aur PYQs ek hi jagah.</p>
          </div>
          <h2 class="section-title">Apni Class Chunein</h2>
          <p class="section-subtitle">Class 10 ya Class 12 select karke aage badhein.</p>
          <div class="grid">
            <div class="card" onclick="selectClass('10')">
              <span class="card-badge">Secondary</span>
              <h3>Class 10th</h3>
              <p>Science, Maths aur baaki subjects ke chapters, diagrams, Q&amp;A aur PYQs.</p>
            </div>
            <div class="card" onclick="selectClass('12')">
              <span class="card-badge">Senior Secondary</span>
              <h3>Class 12th</h3>
              <p>Science, Commerce aur Arts streams ke full chapters, diagrams aur PYQs.</p>
            </div>
          </div>
        `;
        return;
      }

      const cls = STUDY_DATA[state.classId];

      if (cls.hasStreams && !state.streamId) {
        const streamCards = Object.entries(cls.streams).map(([key, strm]) => `
          <div class="card" onclick="selectStream('${key}')">
            <span class="card-badge">Class 12 Stream</span>
            <h3>${strm.name}</h3>
            <p>${strm.desc}</p>
          </div>
        `).join("");

        appEl.innerHTML = `
          <h2 class="section-title">Class 12th — Apni Stream Chunein</h2>
          <p class="section-subtitle">Stream select karne ke baad aapko uske subjects milenge.</p>
          <div class="grid">${streamCards}</div>
        `;
        return;
      }

      if (!state.subjectId) {
        const subjectsObj = cls.hasStreams ? cls.streams[state.streamId].subjects : cls.subjects;
        const subjectCards = Object.entries(subjectsObj).map(([key, subj]) => `
          <div class="card" onclick="selectSubject('${key}')">
            <span class="card-badge">${cls.title}</span>
            <h3>${subj.name}</h3>
            <p>${subj.desc}</p>
          </div>
        `).join("");

        appEl.innerHTML = `
          <h2 class="section-title">Subject Chunein</h2>
          <p class="section-subtitle">Kisi bhi subject par click karke Chapter Listing, PYQs aur Books dekhein.</p>
          <div class="grid">${subjectCards}</div>
        `;
        return;
      }

      const subj = getCurrentSubject();

      if (!state.chapterId) {
        let tabContent = "";
        if (state.subjectTab === "chapters") {
          tabContent = `
            <div class="chapter-list">
              ${subj.chapters.map((ch, idx) => `
                <div class="chapter-row" onclick="selectChapter('${ch.id}')">
                  <div class="chapter-left">
                    <div class="ch-num">${String(idx + 1).padStart(2, "0")}</div>
                    <div>
                      <h3>${ch.number}: ${ch.title}</h3>
                      <p>Notes${ch.diagram ? " &bull; Diagram" : ""} &bull; Question-Answers &bull; Chapter PYQs</p>
                    </div>
                  </div>
                  <span class="arrow-pill">&rsaquo;</span>
                </div>
              `).join("")}
            </div>
          `;
        } else if (state.subjectTab === "pyqs") {
          tabContent = subj.pyqs.map((p, i) => `
            <div class="study-box">
              <span class="card-badge">${i + 1}. ${p.year}</span>
              <h3>${p.title}</h3>
              <a class="btn-link" href="${p.pdfUrl}" target="_blank">Download / View PYQ PDF</a>
            </div>
          `).join("");
        } else if (state.subjectTab === "books") {
          tabContent = subj.books.map((b, i) => `
            <div class="study-box">
              <span class="card-badge">${i + 1}. ${b.type}</span>
              <h3>${b.title}</h3>
              <a class="btn-link" href="${b.pdfUrl}" target="_blank">Open / Download PDF</a>
            </div>
          `).join("");
        }

        appEl.innerHTML = `
          <h2 class="section-title">${subj.name} (${cls.title})</h2>
          <p class="section-subtitle">${subj.desc}</p>
          <div class="tabs">
            <button class="tab-btn ${state.subjectTab === 'chapters' ? 'active' : ''}" onclick="switchSubjectTab('chapters')">Chapters Listing (${subj.chapters.length})</button>
            <button class="tab-btn ${state.subjectTab === 'pyqs' ? 'active' : ''}" onclick="switchSubjectTab('pyqs')">PYQs (Alag Section)</button>
            <button class="tab-btn ${state.subjectTab === 'books' ? 'active' : ''}" onclick="switchSubjectTab('books')">Books &amp; PDFs</button>
          </div>
          ${tabContent}
        `;
        return;
      }

      const ch = subj.chapters.find(c => c.id === state.chapterId);
      let chapterBody = "";

      if (state.chapterTab === "notes") {
        const diagramBlock = ch.diagram ? `
          <div class="diagram-card">
            <img src="${ch.diagram}" alt="${ch.title}" onerror="this.parentElement.style.display='none'" />
            ${ch.diagramCaption ? `<div class="diagram-caption">${ch.diagramCaption}</div>` : ""}
          </div>
        ` : "";

        chapterBody = `
          <div class="study-box">
            <h3>Chapter Notes &amp; Key Points</h3>
            ${diagramBlock}
            <ol class="numbered-list">
              ${ch.notes.map(n => `<li>${n}</li>`).join("")}
            </ol>
          </div>
        `;
      } else if (state.chapterTab === "qna") {
        chapterBody = `
          <div class="study-box">
            <h3>Important Question-Answers</h3>
            ${ch.qna.map(item => `
              <div class="qa-item">
                <div class="qa-q">${item.q}</div>
                <div class="qa-a">${item.a}</div>
              </div>
            `).join("")}
          </div>
        `;
      } else if (state.chapterTab === "pyqs") {
        chapterBody = `
          <div class="study-box">
            <h3>Is Chapter Ke Previous Year Questions (PYQs)</h3>
            ${ch.chapterPyqs.map((item, idx) => `
              <div class="qa-item">
                <span class="card-badge">${idx + 1}. Year: ${item.year}</span>
                <div class="qa-q">${item.q}</div>
                <div class="qa-a"><strong>Answer:</strong> ${item.a}</div>
              </div>
            `).join("")}
          </div>
        `;
      }

      appEl.innerHTML = `
        <h2 class="section-title">${ch.number}: ${ch.title}</h2>
        <p class="section-subtitle">${subj.name} — ${cls.title}</p>
        <div class="tabs">
          <button class="tab-btn ${state.chapterTab === 'notes' ? 'active' : ''}" onclick="switchChapterTab('notes')">Notes &amp; Diagram</button>
          <button class="tab-btn ${state.chapterTab === 'qna' ? 'active' : ''}" onclick="switchChapterTab('qna')">Question-Answers</button>
          <button class="tab-btn ${state.chapterTab === 'pyqs' ? 'active' : ''}" onclick="switchChapterTab('pyqs')">Chapter PYQs</button>
        </div>
        ${chapterBody}
      `;
    }

    function handleSearch(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        render();
        return;
      }

      let results = [];
      Object.entries(STUDY_DATA).forEach(([classId, cls]) => {
        const processSubjects = (subjects, streamId = null) => {
          Object.entries(subjects).forEach(([subjId, subj]) => {
            subj.chapters.forEach(ch => {
              const matchText = `${ch.title} ${ch.notes.join(" ")} ${ch.qna.map(x => x.q).join(" ")}`.toLowerCase();
              if (matchText.includes(q) || subj.name.toLowerCase().includes(q)) {
                results.push({
                  classId,
                  streamId,
                  subjId,
                  chapterId: ch.id,
                  label: `${cls.title} &bull; ${subj.name}`,
                  title: `${ch.number}: ${ch.title}`
                });
              }
            });
          });
        };

        if (cls.hasStreams) {
          Object.entries(cls.streams).forEach(([streamId, strm]) => {
            processSubjects(strm.subjects, streamId);
          });
        } else {
          processSubjects(cls.subjects);
        }
      });

      breadcrumbsEl.innerHTML = `<span onclick="goHome()">Home</span> &rsaquo; Search Results for "${query}"`;

      if (results.length === 0) {
        appEl.innerHTML = `<p class="section-subtitle">Koi result nahi mila. Koi doosra chapter ya subject search karein.</p>`;
        return;
      }

      appEl.innerHTML = `
        <h2 class="section-title">Search Results (${results.length})</h2>
        <div class="chapter-list">
          ${results.map((r, i) => `
            <div class="chapter-row" onclick="openSearchResult('${r.classId}', ${r.streamId ? `'${r.streamId}'` : 'null'}, '${r.subjId}', '${r.chapterId}')">
              <div class="chapter-left">
                <div class="ch-num">${i + 1}</div>
                <div>
                  <span class="card-badge">${r.label}</span>
                  <h3>${r.title}</h3>
                </div>
              </div>
              <span class="arrow-pill">&rsaquo;</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function openSearchResult(classId, streamId, subjId, chapterId) {
      state.classId = classId;
      state.streamId = streamId;
      state.subjectId = subjId;
      state.chapterId = chapterId;
      state.chapterTab = "notes";
      document.getElementById("searchInput").value = "";
      render();
    }

    render();
  </script>
</body>
</html>
